networks:
  base_default:
    external: true

name: bombcrypto
services:

  ap-blockchain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ap-blockchain
    ports:
      - "8102:80"
    networks:
      - base_default
    env_file:
      - .env
    environment:
      TZ: 'Asia/Bangkok'
      PORT: '80'
      REDIS_CONNECTION_STRING: 'redis://@redis:6379/0'
      POSTGRES_CONNECTION_STRING: 'postgres://postgres:123456@postgres:5432/blockchain'
      ENABLE_REQUEST_LOGGING: true
      BLOCKCHAIN_CENTER_API: 'http://192.168.1.102:8307'
